# =============================================================================
# LiteLLM gateway configuration — AWS BEDROCK mode (AWS deployment ONLY)
# =============================================================================
# Selected by AI_PROVIDER_MODE=bedrock in .env (docs/decisions/ADR-0004).
# Credentials: NONE in this file. LiteLLM authenticates to Bedrock via the
# EC2 instance profile (IMDS) — the litellm service runs on the host network
# in AWS mode (deploy/compose/aws.yml) because IMDSv2 hop limit 1
# blocks container networks. No static AWS keys exist anywhere in this stack.
# =============================================================================

model_list:
  - model_name: anthropic.claude-3-5-sonnet-20241022-v2:0
    litellm_params:
      model: bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0
      aws_region_name: ap-southeast-1

  - model_name: amazon.nova-pro-v1:0
    litellm_params:
      model: bedrock/amazon.nova-pro-v1:0
      aws_region_name: ap-southeast-1

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
