name: terraform-plan
# Plans the POC environment. NEVER APPLIES.
# Planning real AWS resources requires credentials; without the repo secret
# the job degrades to validate-only so PRs never silently skip syntax drift.
on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-plan.yaml'
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for OIDC-based AWS auth, if the owner configures it
    steps:
      - uses: actions/checkout@v4
      - name: validate (always, no credentials)
        run: tests/infrastructure/run.sh
      - name: plan (only when AWS creds are configured)
        if: ${{ vars.AWS_PLAN_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: terraform plan
        if: ${{ vars.AWS_PLAN_ROLE_ARN != '' }}
        run: |
          cd infra/terraform/environments/dev
          printf 'admin_cidr = "203.0.113.0/24"\n' > ci.tfvars # placeholder CIDR; plan-shape only
          terraform init -backend=false
          terraform plan -var-file=ci.tfvars -out ci.tfplan
          terraform show ci.tfplan > plan.txt
      - uses: actions/upload-artifact@v4
        if: ${{ vars.AWS_PLAN_ROLE_ARN != '' }}
        with:
          name: poc-plan
          path: infra/terraform/environments/dev/plan.txt
